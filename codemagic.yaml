workflows:
  flutter_with_python:
    name: Flutter + Chaquopy (spaCy offline)
    environment:
      flutter: stable
    scripts:
      - name: Setup Python dependencies
        script: |
          cd android
          echo "chaquopy { defaultConfig { pythonVersion '3.11' } }" >> build.gradle
      - name: Build APK
        script: |
          flutter pub get
          flutter build apk
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
